<section class="wrap cases" aria-labelledby="cases-h">
  <h2 id="cases-h">What we are working on</h2>
  <p>Four projects that show how we bring data, software and AI together. Two of them are still in development, and we say so.</p>
  <figure class="carousel carousel--cases" data-interval="8000" aria-roledescription="carousel" aria-label="What we are working on">
    <div class="carousel__viewport">
    <ul class="carousel__track" tabindex="0" aria-label="What we are working on">
    <li class="carousel__slide" aria-roledescription="slide" aria-label="1 of 4">
      <figure class="case__media case__media--wide">
        <a class="zoom" href="{{ "/assets/images/sportsmap-1600.jpg" | relative_url }}">
        <picture>
          <source type="image/webp" srcset="{{ "/assets/images/sportsmap-800.webp" | relative_url }} 800w, {{ "/assets/images/sportsmap-1600.webp" | relative_url }} 1600w" sizes="(min-width: 60rem) 480px, 90vw">
          <img src="{{ "/assets/images/sportsmap-800.jpg" | relative_url }}" srcset="{{ "/assets/images/sportsmap-800.jpg" | relative_url }} 800w, {{ "/assets/images/sportsmap-1600.jpg" | relative_url }} 1600w" sizes="(min-width: 60rem) 480px, 90vw" width="800" height="476" loading="lazy" alt="3D terrain map with a marked tour route over mountains and through a town.">
        </picture>
        </a>
      </figure>
      <div class="case__body">
        <div class="case__head">
        <span class="case__status">In development</span>
        <h3>Tour planner that builds the tour for the day</h3>
        </div>
        <div class="case__text">
        <p>Most tour portals show a database of ready-made tours. Our planner creates the tour for the user and the day. It combines weather, warnings and closures with fitness, time budget and preferences, and with trail surface, gradient, shade and places to rest or eat.</p>
        <p>The result is a route that fits, instead of a list to search through.</p>
        </div>
      </div>
    </li>
    <li class="carousel__slide" aria-roledescription="slide" aria-label="2 of 4">
      <figure class="case__media">
        <a class="zoom" href="{{ "/assets/images/skimap-780.jpg" | relative_url }}">
        <picture>
          <source type="image/webp" srcset="{{ "/assets/images/skimap-390.webp" | relative_url }} 390w, {{ "/assets/images/skimap-780.webp" | relative_url }} 780w" sizes="(min-width: 60rem) 256px, 60vw">
          <img src="{{ "/assets/images/skimap-390.jpg" | relative_url }}" srcset="{{ "/assets/images/skimap-390.jpg" | relative_url }} 390w, {{ "/assets/images/skimap-780.jpg" | relative_url }} 780w" sizes="(min-width: 60rem) 256px, 60vw" width="390" height="823" loading="lazy" alt="Mobile 3D ski-area map with pistes, lifts and video points along the run.">
        </picture>
        </a>
      </figure>
      <div class="case__body">
        <div class="case__head">
        <span class="case__status">In development</span>
        <h3>SkiApp: the ski day, measured and shared</h3>
        </div>
        <div class="case__text">
        <p>The app records the skier's statistics and health data and links them to the geography of the ski area. Photos and videos are embedded in a 3D replay of the run that can be shared with friends and followers.</p>
        <p>Behind it: a terrain model, piste data, on-device positioning, and a snow and weather report from several sources.</p>
        </div>
      </div>
    </li>
    <li class="carousel__slide" aria-roledescription="slide" aria-label="3 of 4">
      <figure class="case__media">
        <a class="zoom" href="{{ "/assets/images/screenshot_storymapp_english-780.jpg" | relative_url }}">
        <picture>
          <source type="image/webp" srcset="{{ "/assets/images/screenshot_storymapp_english-390.webp" | relative_url }} 390w, {{ "/assets/images/screenshot_storymapp_english-780.webp" | relative_url }} 780w" sizes="(min-width: 60rem) 256px, 60vw">
          <img src="{{ "/assets/images/screenshot_storymapp_english-390.jpg" | relative_url }}" srcset="{{ "/assets/images/screenshot_storymapp_english-390.jpg" | relative_url }} 390w, {{ "/assets/images/screenshot_storymapp_english-780.jpg" | relative_url }} 780w" sizes="(min-width: 60rem) 256px, 60vw" width="390" height="844" loading="lazy" alt="StoryMapp app: map of Upper Bavaria with round photo markers for places with stories.">
        </picture>
        </a>
      </figure>
      <div class="case__body">
        <div class="case__head">
        <span class="case__status">In operation</span>
        <h3>StoryMapp: stories about places, worldwide</h3>
        </div>
        <div class="case__text">
        <p>Our own product, free for iOS and Android. More than 8 million stories in six languages, worldwide coverage, a monthly update cycle, users in 58 countries. Partner: the artists' project Art Hop Silver Lake in Los Angeles.</p>
        <p>The data pipeline behind it runs without manual work, and the users' location never leaves the device. <a class="link" href="{{ "/en/storymapp/" | relative_url }}">About StoryMapp →</a></p>
        </div>
      </div>
    </li>
    <li class="carousel__slide" aria-roledescription="slide" aria-label="4 of 4">
      <div class="case__body">
        <div class="case__head">
        <span class="case__status">In development</span>
        <h3>Emergency map for disaster response</h3>
        </div>
        <div class="case__text">
        <p>A map that works without network and without power, and is still current. It gives emergency services orientation and a basis for planning during a large-scale blackout, on the device, from current open data.</p>
        </div>
      </div>
    </li>
