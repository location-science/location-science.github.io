<header class="bar" role="banner">
  <div class="wrap bar__inner">
    <a class="bar__brand" rel="home" href="{{ "/" | relative_url }}">
      <img src="{{ "/assets/images/logo_512_transp.png" | relative_url }}" alt="" width="30" height="30">
      <span>{{ site.title | escape }}</span>
    </a>
    <input type="checkbox" id="bar-toggle" class="bar__toggle" aria-label="Open the menu">
    <label for="bar-toggle" class="bar__label">Menu</label>
    <nav class="bar__nav" aria-label="Primary">
      <ul>
        <li><a href="{{ "/storymapp/" | relative_url }}"{% if page.url == "/storymapp/" %} aria-current="page"{% endif %}>StoryMapp</a></li>
        <li><a href="{{ "/storymapp/#share" | relative_url }}">For partners</a></li>
        <li><a href="{{ "/about/" | relative_url }}"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a></li>
        <li><a href="mailto:{{ site.email }}">Contact</a></li>
      </ul>
    </nav>
    <a class="btn btn--primary bar__cta" href="mailto:{{ site.email }}">Write to us</a>
  </div>
</header>
