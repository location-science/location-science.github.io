  <h2 id="cases-h">Woran wir arbeiten</h2>
  <p>Vier Projekte, die zeigen, wie wir Daten, Software und KI zusammenbringen. Zwei davon sind noch in Entwicklung, das sagen wir dazu.</p>

    <li class="carousel__slide" aria-roledescription="Folie" aria-label="1 von 4">

        <a class="zoom" href="{{ "/assets/images/sportsmap-1600.jpg" | relative_url }}">
        <picture>
          <source type="image/webp" srcset="{{ "/assets/images/sportsmap-800.webp" | relative_url }} 800w, {{ "/assets/images/sportsmap-1600.webp" | relative_url }} 1600w" sizes="(min-width: 60rem) 480px, 90vw">
          <img src="{{ "/assets/images/sportsmap-800.jpg" | relative_url }}" srcset="{{ "/assets/images/sportsmap-800.jpg" | relative_url }} 800w, {{ "/assets/images/sportsmap-1600.jpg" | relative_url }} 1600w" sizes="(min-width: 60rem) 480px, 90vw" width="800" height="476" loading="lazy" alt="3D-Geländekarte mit einer markierten Tourenroute über Berge und durch einen Ort.">
        </picture>
        </a>
      </figure>
      <div class="case__body">
        <div class="case__head">
        <span class="case__status">In Entwicklung</span>
        <h3>Tourenplaner, der die Tour für den Tag baut</h3>
        </div>
        <div class="case__text">
        <p>Die meisten Tourenportale zeigen eine Datenbank fertiger Touren. Unser Planer erstellt die Tour für den Nutzer und den Tag. Er verbindet Wetter, Warnungen und Sperrungen mit Fitness, Zeitbudget und Wünschen und mit Wegebeschaffenheit, Steigung, Schatten und Einkehrmöglichkeiten.</p>
        <p>Das Ergebnis ist eine Route, die passt, statt einer Liste zum Durchsuchen.</p>
        </div>
      </div>
    </li>
    <li class="carousel__slide" aria-roledescription="Folie" aria-label="2 von 4">
      <figure class="case__media">
        <a class="zoom" href="{{ "/assets/images/skimap-780.jpg" | relative_url }}">
        <picture>
          <source type="image/webp" srcset="{{ "/assets/images/skimap-390.webp" | relative_url }} 390w, {{ "/assets/images/skimap-780.webp" | relative_url }} 780w" sizes="(min-width: 60rem) 256px, 60vw">
          <img src="{{ "/assets/images/skimap-390.jpg" | relative_url }}" srcset="{{ "/assets/images/skimap-390.jpg" | relative_url }} 390w, {{ "/assets/images/skimap-780.jpg" | relative_url }} 780w" sizes="(min-width: 60rem) 256px, 60vw" width="390" height="823" loading="lazy" alt="Mobile 3D-Skigebietskarte mit Pisten, Liften und Video-Punkten entlang der Abfahrt.">
        </picture>
        </a>
      </figure>
      <div class="case__body">
        <div class="case__head">
        <span class="case__status">In Entwicklung</span>
        <h3>SkiApp: der Skitag, messbar und teilbar</h3>
        </div>
        <div class="case__text">
        <p>Die App erfasst Statistik und Gesundheitsdaten des Sportlers und verknüpft sie mit der Geographie des Skigebiets. Eigene Fotos und Videos werden in ein 3D-Replay der Abfahrt eingebettet, das sich mit Freunden und Followern teilen lässt.</p>
        <p>Dahinter stehen Geländemodell, Pistendaten, Positionierung auf dem Gerät und ein Schnee- und Wetterbericht aus mehreren Quellen.</p>
        </div>
      </div>
    </li>
    <li class="carousel__slide" aria-roledescription="Folie" aria-label="3 von 4">
      <figure class="case__media">
        <a class="zoom" href="{{ "/assets/images/screenshot_storymapp-780.jpg" | relative_url }}">
        <picture>
          <source type="image/webp" srcset="{{ "/assets/images/screenshot_storymapp-390.webp" | relative_url }} 390w, {{ "/assets/images/screenshot_storymapp-780.webp" | relative_url }} 780w" sizes="(min-width: 60rem) 256px, 60vw">
          <img src="{{ "/assets/images/screenshot_storymapp-390.jpg" | relative_url }}" srcset="{{ "/assets/images/screenshot_storymapp-390.jpg" | relative_url }} 390w, {{ "/assets/images/screenshot_storymapp-780.jpg" | relative_url }} 780w" sizes="(min-width: 60rem) 256px, 60vw" width="390" height="844" loading="lazy" alt="StoryMapp-App: Karte von Oberbayern mit runden Fotomarkern für Orte mit Geschichten.">
        </picture>
        </a>
      </figure>
      <div class="case__body">
        <div class="case__head">
        <span class="case__status">Im Betrieb</span>
        <h3>StoryMapp: Geschichten zu Orten, weltweit</h3>
        </div>
        <div class="case__text">
        <p>Unser eigenes Produkt, kostenlos für iOS und Android. Über 8 Millionen Geschichten in sechs Sprachen, weltweite Abdeckung, monatlicher Aktualisierungszyklus, Nutzer in 58 Ländern. Partner: das Künstlerprojekt Art Hop Silver Lake in Los Angeles.</p>
        <p>Die Datenpipeline dahinter läuft ohne Handarbeit, und der Standort der Nutzer verlässt nie das Gerät. <a class="link" href="{{ "/storymapp/" | relative_url }}">Über StoryMapp →</a></p>
        </div>
      </div>
    </li>
    <li class="carousel__slide" aria-roledescription="Folie" aria-label="4 von 4">
      <div class="case__body">
        <div class="case__head">
        <span class="case__status">In Entwicklung</span>
        <h3>Einsatzkarte für den Katastrophenfall</h3>
        </div>
        <div class="case__text">
        <p>Eine Karte, die ohne Netz und ohne Strom funktioniert und trotzdem aktuell ist. Sie gibt Rettungsorganisationen bei einem großflächigen Stromausfall Orientierung und eine Grundlage für die Einsatzplanung, auf dem Gerät, aus aktuellen offenen Daten.</p>
        </div>
      </div>
