<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    {%- seo -%}

    <meta name="keywords" content="{% if page.keywords %}{{ page.keywords }}, {% endif %}{{ site.keywords }}">
    <meta name="author" content="{{ site.company_name }}">
    <meta name="robots" content="index, follow">
    {%- assign lang = page.lang | default: "de" %}
    {%- if page.translation %}
    {%- if lang == "de" %}
    <link rel="alternate" hreflang="de" href="{{ page.url | absolute_url }}">
    <link rel="alternate" hreflang="en" href="{{ page.translation | absolute_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}">
    {%- else %}
    <link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
    <link rel="alternate" hreflang="de" href="{{ page.translation | absolute_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ page.translation | absolute_url }}">
    {%- endif %}
    {%- endif %}

    {%- if page.app_schema %}
    <!-- Smart App Banner and app schema: StoryMapp page only -->
    <meta name="apple-itunes-app" content="app-id={{ site.app_id_ios }}">
    <meta name="google-play-app" content="app-id={{ site.app_id_android }}">
    {%- include app-schema.html -%}
    {%- endif %}

    <!-- Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "{{ site.company_name }}",
      "alternateName": "Location Science",
      "url": "{{ site.url }}",
      "logo": "{{ site.logo | absolute_url }}",
      "description": "{{ site.description | strip_newlines | strip | escape }}",
      "email": "{{ site.email }}",
      "foundingDate": "2024",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Purrbachstr. 7c",
        "postalCode": "85305",
        "addressLocality": "Jetzendorf",
        "addressRegion": "Bavaria",
        "addressCountry": "DE"
      },
      "vatID": "{{ site.company_vat }}",
      "knowsAbout": ["Application development", "Software engineering", "Database engineering", "Data pipelines", "GeoAI", "Data science", "Spatial intelligence", "Mobile engineering", "Navigation", "Digitalisation consulting", "AI adoption", "Spatial data management"],
      "sameAs": ["https://github.com/{{ site.github_username }}"],
      "makesOffer": {
        "@type": "Offer",
        "itemOffered": { "@type": "SoftwareApplication", "name": "StoryMapp", "url": "{{ '/storymapp/' | absolute_url }}" }
      }
    }
    </script>

    <!-- Type: self-hosted Space Grotesk, Geist, JetBrains Mono (no third-party font servers) -->
    {%- assign asset_v = site.time | date: "%Y%m%d%H%M" %}
    <link rel="stylesheet" href="{{ "/assets/css/fonts.css" | relative_url }}?v={{ asset_v }}">

    <link rel="stylesheet" href="{{ "/assets/css/tokens.css" | relative_url }}?v={{ asset_v }}">
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}?v={{ asset_v }}">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="{{ "/assets/favicon/favicon.ico" | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon/favicon-32x32.png" | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/favicon/favicon-16x16.png" | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/favicon/apple-touch-icon.png" | relative_url }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ "/assets/favicon/android-chrome-192x192.png" | relative_url }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ "/assets/favicon/android-chrome-512x512.png" | relative_url }}">
    <link rel="manifest" href="{{ "/assets/favicon/site.webmanifest" | relative_url }}">

    {%- feed_meta -%}

    <!-- EU/German compliance -->
    <meta name="dc.language" content="{{ page.lang | default: "de" }}">
    <meta name="dc.creator" content="{{ site.company_name }}">
    <meta name="dc.publisher" content="{{ site.company_name }}">
    <meta name="dc.rights" content="© {{ 'now' | date: '%Y' }} {{ site.company_name }}. All rights reserved.">
</head>
