{%- assign lang = page.lang | default: "de" -%}
{%- assign t = site.data.i18n[lang] -%}
<div id="cookie-banner" role="region" aria-label="Cookies">
    <div class="cookie-content">
        <p>{{ t.cookie.text }} <a href="{{ t.cookie.learn_url | relative_url }}">{{ t.cookie.learn }}</a>.</p>
        <div class="cookie-buttons">
            <button id="accept-all" class="cookie-button">{{ t.cookie.accept_all }}</button>
            <button id="accept-necessary" class="cookie-button">{{ t.cookie.necessary }}</button>
            <button id="show-details" class="cookie-button">{{ t.cookie.details }}</button>
        </div>
        <div class="cookie-details" style="display: none;">
            <div class="cookie-option">
                <label>
                    <input type="checkbox" id="analytics">
                    {{ t.cookie.analytics }}
                </label>
                <p>{{ t.cookie.analytics_desc }}</p>
            </div>
            <div class="cookie-option">
                <label>
                    <input type="checkbox" id="preferences">
                    {{ t.cookie.preferences }}
                </label>
                <p>{{ t.cookie.preferences_desc }}</p>
            </div>
            <button id="save-preferences" class="cookie-button">{{ t.cookie.save }}</button>
        </div>
    </div>
</div>

<script src="{{ "/assets/js/cookie-banner.js" | relative_url }}"></script>
